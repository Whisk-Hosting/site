<section class="block hero">
  <div>
    {{if .First}}<h1>{{.B.heading}}</h1>{{else}}<h2>{{.B.heading}}</h2>{{end}}
    {{with .B.text}}<p class="lead">{{.}}</p>{{end}}
    {{with .B.link}}{{if and .url .label}}<a class="button" href="{{.url}}">{{.label}}</a>{{end}}{{end}}
  </div>
  {{img .B.image 720 .First ""}}
</section>
