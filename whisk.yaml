whisk: 1
name: whisk-site

# Every page is public. The business's team edits the site at /app through their Whisk sign-in
# (the editor checks it on each request). The website's forms (/forms/*) pass the edge's challenge
# first, so robots cannot fill them.
routes:
  public: ["/**"]
  challenge: ["/forms/*"]

# The business's own admin, which the Whisk bar links for its team: the editor, and the editor
# opened at the page being looked at (server.mjs).
admin:
  path: /app
  edit: "/cms/edit?path={path}"

health:
  path: /health/ready
  timeout: 60

database: app
migrate: "node migrate.mjs"

storage: true

env:
  # The port of this machine the editor (cms/) answers on, inside the app only (server/cms.mjs).
  CMS_PORT: "9100"
  # The editor is part of a website, not a shop: it offers no product pages or products block
  # (cms/src/app.ts).
  CMS_SHOP: "0"
  # The business's time zone for the times the editor shows, such as enquiries (cms/src/admin/data.ts).
  SITE_TIME_ZONE: "UTC"
